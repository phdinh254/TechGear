# CSDL MySQL 8.4 cho backend TechGear: docker compose up -d
# Lược đồ do Flyway trong backend tạo; xóa sạch dữ liệu: docker compose down -v
services:
  mysql:
    image: mysql:8.4
    container_name: techgear-mysql
    environment:
      MYSQL_DATABASE: techgear
      MYSQL_USER: techgear
      MYSQL_PASSWORD: techgear
      MYSQL_ROOT_PASSWORD: techgear-root
      TZ: Asia/Ho_Chi_Minh
    # Giờ Việt Nam cho NOW()/CURRENT_TIMESTAMP; utf8mb4 không phân biệt hoa thường + dấu
    command: ["--default-time-zone=+07:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${TECHGEAR_DB_PORT:-3307}:3306"
    volumes:
      - techgear-mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u techgear -ptechgear --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  techgear-mysqldata:
