# Profile dev: chạy trên máy cá nhân với MySQL của docker-compose.yml (cổng 3307)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/techgear}
spring.datasource.username=${DB_USERNAME:techgear}
spring.datasource.password=${DB_PASSWORD:techgear}

# Dữ liệu mẫu (script lặp R__ của Flyway) chỉ nạp ở dev
spring.flyway.locations=classpath:db/migration,classpath:db/du-lieu-mau

# Khóa JWT chỉ dùng khi phát triển – KHÔNG dùng khi triển khai
app.jwt.khoa-bi-mat=${JWT_SECRET:techgear-dev-khoa-jwt-chi-dung-tren-may-ca-nhan-0123456789}

# Chưa cấu hình MAIL_USERNAME thì in liên kết đặt lại mật khẩu ra log (chỉ dev – liên kết chứa mã dùng được ngay)
app.mail.ghi-lien-ket-ra-log=true

# PayOS: chưa đặt khóa thật thì giả lập (link về thẳng trang kết quả, luôn báo đã thanh toán).
# Đặt PAYOS_CLIENT_ID, PAYOS_API_KEY, PAYOS_CHECKSUM_KEY và PAYOS_GIA_LAP=false để dùng PayOS thật.
# Khóa checksum giả dưới đây chỉ để ký webhook thử bằng Postman.
app.payos.gia-lap=${PAYOS_GIA_LAP:true}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:techgear-dev-payos-khong-phai-khoa-that}
