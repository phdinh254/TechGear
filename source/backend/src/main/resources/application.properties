# ================== TechGear Backend ==================
spring.application.name=techgear-backend
server.port=8080

# ---------- Cơ sở dữ liệu ----------
# XAMPP mặc định: user root, mật khẩu rỗng, cổng 3306
spring.datasource.url=jdbc:mysql://localhost:3306/techgear?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=

# Bảng được tạo bằng database/DB_TechGear.sql, Hibernate KHÔNG tự tạo/sửa bảng
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
# Nạp theo lô để tránh lỗi N+1 khi đọc quan hệ LAZY
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- JSON ----------
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Upload ảnh ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads

# ---------- JWT ----------
# Khóa bí mật Base64 (>= 256 bit). Khi triển khai thật hãy đổi khóa khác.
app.jwt.secret=uJ5CrO/2qIRL7QbG4PiAy0/v3H/LUsS75YiVoOQBKYfEK/CX72BE6kbANA3YDj1KajPWH//GYrEDFYgvgWsAjA==
# Thời hạn token: 1 ngày (mili giây)
app.jwt.expiration-ms=86400000

# ---------- CORS (địa chỉ frontend React - Vite) ----------
app.cors.allowed-origins=http://localhost:5173
