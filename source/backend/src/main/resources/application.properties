# Cấu hình chung. Giá trị bí mật / theo môi trường lấy từ biến môi trường (xem .env.example).
# Chạy trên máy cá nhân: mvn spring-boot:run (tự bật profile dev – application-dev.properties).
# Đọc thêm file .env (định dạng KEY=giá trị) ở thư mục chạy nếu có – nơi đặt khóa bí mật trên máy cá nhân.
# .env đã nằm trong .gitignore, không commit; biến môi trường của hệ điều hành/IDE vẫn được ưu tiên hơn.
spring.config.import=optional:file:.env[.properties]
spring.application.name=techgear-backend
server.port=${SERVER_PORT:8080}

# CSDL MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Cột DATETIME lưu giờ Việt Nam: cố định múi giờ phiên (NOW(), thống kê theo ngày) và múi giờ driver dùng khi đổi
# OffsetDateTime <-> DATETIME, không phụ thuộc múi giờ máy chạy. Việt Nam không đổi giờ mùa hè nên +07:00 cố định.
spring.datasource.hikari.connection-init-sql=SET time_zone = '+07:00'
spring.datasource.hikari.data-source-properties.connectionTimeZone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
# Hibernate mặc định quy OffsetDateTime về UTC với CSDL không có kiểu múi giờ → đổi theo jdbc.time_zone ở trên
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE
# READ COMMITTED như PostgreSQL: sau khi khóa dòng (FOR UPDATE), SELECT thường thấy dữ liệu giao dịch khác vừa ghi
# (VD đếm lượt dùng mã giảm giá khi đặt hàng đồng thời); mặc định REPEATABLE READ của InnoDB sẽ đọc ảnh chụp cũ
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.locations=classpath:db/migration

# JSON: thời gian ISO-8601 theo giờ Việt Nam
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Upload ảnh
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
app.upload.thu-muc=${UPLOAD_DIR:uploads}

# JWT (HS256) – bắt buộc đặt JWT_SECRET (≥ 32 ký tự) khi không chạy profile dev
app.jwt.khoa-bi-mat=${JWT_SECRET:}
app.jwt.thoi-han=24h

# Frontend và CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend-url}}

# PayOS (kênh thanh toán ở my.payos.vn, không có sandbox) – thiếu khóa thì API tạo link thanh toán trả 503
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payos.api-url=${PAYOS_API_URL:https://api-merchant.payos.vn}
app.payos.return-url=${PAYOS_RETURN_URL:${app.frontend-url}/thanh-toan/ket-qua}
app.payos.cancel-url=${PAYOS_CANCEL_URL:${app.frontend-url}/thanh-toan/ket-qua}
app.payos.gia-lap=false

# Email (chưa có MAIL_USERNAME thì ghi nội dung email ra log)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:TechGear <no-reply@techgear.vn>}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
