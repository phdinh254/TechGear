# CSDL MySQL 8.4 cho backend TechGear: docker compose up -d
# Lược đồ do Flyway trong backend tạo; xóa sạch dữ liệu: docker compose down -v
services:
  mysql:
    image: mysql:8.4
    container_name: techgear-mysql
    environment:
      MYSQL_DATABASE: techgear
      MYSQL_USER: techgear
      MYSQL_PASSWORD: techgear
      MYSQL_ROOT_PASSWORD: techgear-root
      TZ: Asia/Ho_Chi_Minh
    # Giờ Việt Nam cho NOW()/CURRENT_TIMESTAMP; utf8mb4 không phân biệt hoa thường + dấu
    command: ["--default-time-zone=+07:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${TECHGEAR_DB_PORT:-3307}:3306"
    volumes:
      - techgear-mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u techgear -ptechgear --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Cả backend + frontend trong Docker (chỉ khi bật profile app): docker compose --profile app up -d --build
  # Chạy profile dev của Spring (dữ liệu mẫu, khóa JWT/VNPay giả) – chỉ để kiểm tra trên máy cá nhân, không dùng triển khai thật.
  backend:
    profiles: [app]
    build: ./source/backend
    container_name: techgear-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/techgear
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8080:8080"
    volumes:
      - techgear-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  # Trình duyệt gọi backend qua http://localhost:8080 nên frontend giữ cổng 5173 cho khớp CORS mặc định
  frontend:
    profiles: [app]
    build:
      context: ./source/frontend
      dockerfile: ../../docker/frontend.Dockerfile
    container_name: techgear-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  techgear-mysqldata:
  techgear-uploads:
