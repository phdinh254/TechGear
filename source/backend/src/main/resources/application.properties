# ================== TechGear Backend ==================
# Mọi giá trị dạng ${BIEN:mac_dinh} đọc từ biến môi trường BIEN; không khai báo thì dùng mặc định
# (mặc định phù hợp chạy thử trên máy cá nhân với XAMPP). Khi triển khai thật hãy đặt biến môi trường.
spring.application.name=techgear-backend
server.port=${SERVER_PORT:8080}

# ---------- Cơ sở dữ liệu ----------
# XAMPP mặc định: user root, mật khẩu rỗng, cổng 3306
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/techgear?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Bảng được tạo bằng database/DB_TechGear.sql, Hibernate KHÔNG tự tạo/sửa bảng
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
# Nạp theo lô để tránh lỗi N+1 khi đọc quan hệ LAZY
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- JSON ----------
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Upload ảnh ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:uploads}

# ---------- JWT ----------
# Khóa bí mật Base64 (>= 256 bit). Khóa mặc định chỉ dùng khi phát triển, triển khai thật PHẢI đặt JWT_SECRET.
app.jwt.secret=${JWT_SECRET:uJ5CrO/2qIRL7QbG4PiAy0/v3H/LUsS75YiVoOQBKYfEK/CX72BE6kbANA3YDj1KajPWH//GYrEDFYgvgWsAjA==}
# Thời hạn token: 1 ngày (mili giây)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Frontend ----------
# Địa chỉ frontend React (Vite): dùng cho CORS và đường dẫn trong email
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend-url}}

# ---------- Email (SMTP) ----------
# Gmail: bật xác minh 2 bước rồi tạo "Mật khẩu ứng dụng" (App Password) làm MAIL_PASSWORD.
# Để trống MAIL_USERNAME thì hệ thống KHÔNG gửi email thật mà ghi nội dung email ra log (tiện chạy thử).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:TechGear <no-reply@techgear.vn>}
# Thời hạn liên kết đặt lại mật khẩu (phút)
app.reset-password.expiration-minutes=${RESET_PASSWORD_EXPIRATION_MINUTES:15}

# ---------- Tài liệu API (Swagger UI) ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
